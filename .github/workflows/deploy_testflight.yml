name: Build & Deploy to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_unity_xcode:
    name: Build Unity iOS (Export Xcode)
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Cache Unity Library directory for faster builds
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # 3. Build Unity Project to Xcode Project
      - name: Build Unity for iOS (Export Xcode)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          buildMethod: Pulsevania.EditorTools.BuildScript.BuildiOS
          buildName: Pulsevania
          buildsPath: Builds

      # 3b. Extract and Print Detailed Unity Editor.log
      - name: Extract and Print Unity Editor.log
        if: always()
        run: |
          echo "=== SEARCHING FOR SYSTEM-WIDE UNITY EDITOR.LOG ==="
          sudo chmod -R 777 . /tmp 2>/dev/null || true
          
          # Find all Editor.log or unity log files across the filesystem
          LOG_FILE=$(sudo find / -name "Editor.log" -o -name "unity*.log" 2>/dev/null | grep -v "/proc" | grep -v "/sys" | head -n 1)

          if [ -n "$LOG_FILE" ] && [ -f "$LOG_FILE" ]; then
            echo "Found Unity Editor Log at: $LOG_FILE"
            sudo cp "$LOG_FILE" $GITHUB_WORKSPACE/extracted_unity_editor.log
            sudo chmod 777 $GITHUB_WORKSPACE/extracted_unity_editor.log
            
            echo "=== CRITICAL ERRORS & EXCEPTIONS IN EDITOR.LOG ==="
            grep -iE "error|exception|failed|iOS|Xcode|BuildPipeline|BuildScript|Compilation" $GITHUB_WORKSPACE/extracted_unity_editor.log | tail -n 200 || true
            
            echo "=== LAST 300 LINES OF EDITOR.LOG ==="
            tail -n 300 $GITHUB_WORKSPACE/extracted_unity_editor.log || true
          else
            echo "No Editor.log found via find command. Checking workspace..."
            ls -la *.log 2>/dev/null || true
          fi

      # 3c. Upload Full Unity Build Log Artifact (Always)
      - name: Upload Unity Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editor-log
          path: |
            extracted_unity_editor.log
            *.log
            Library/Logs/**/*.log
          if-no-files-found: warn

      # 4. Upload exported Xcode Project Artifact
      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: Builds/iOS

  deploy_testflight:
    name: Deploy to TestFlight (macOS)
    runs-on: macos-14
    needs: build_unity_xcode
    steps:
      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Download Exported Xcode Project Artifact
      - name: Download Xcode Project Artifact
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: Builds/iOS

      # 3. Install Apple Certificate & Provisioning Profile
      - name: Install Apple Certificate and Provisioning Profile
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          PROVISION_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$PROVISION_BASE64" ]; then
            echo "::error::Missing required signing secrets! Please verify APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASS, and APPLE_PROVISION_PROFILE_BASE64 in GitHub Secrets."
            exit 1
          fi

          # Ensure Homebrew OpenSSL 3 is available for modern PKCS12 legacy conversion
          BREW_OPENSSL_PREFIX=$(brew --prefix openssl@3 2>/dev/null || echo "/opt/homebrew/opt/openssl@3")
          if [ -f "$BREW_OPENSSL_PREFIX/bin/openssl" ]; then
            OPENSSL="$BREW_OPENSSL_PREFIX/bin/openssl"
          else
            echo "Installing openssl@3 via brew..."
            brew install openssl@3
            OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          fi

          echo "Using OpenSSL binary at: $OPENSSL"
          "$OPENSSL" version

          # Setup Keychain Path
          mkdir -p "$HOME/Library/Keychains"
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          KEYCHAIN_PASS="ci_keychain_password"

          # Clean existing temporary keychain if re-run (idempotent)
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

          # 1. Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # 2. Clean and decode .p12 certificate with OpenSSL 3
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          CERT_B64_FILE="$RUNNER_TEMP/cert_b64.txt"
          
          echo "$P12_BASE64" | tr -d '\r\n ' > "$CERT_B64_FILE"
          "$OPENSSL" base64 -d -A -in "$CERT_B64_FILE" -out "$CERT_PATH"

          FILE_SIZE=$(wc -c < "$CERT_PATH" | tr -d ' ')
          echo "Decoded P12 Certificate file size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "::error::Decoded P12 file is suspiciously small ($FILE_SIZE bytes). Please verify APPLE_CERTIFICATE_P12_BASE64 secret in GitHub!"
            exit 1
          fi

          # 3. Import P12 Certificate into Keychain (with Homebrew OpenSSL 3 legacy fallback)
          echo "Importing P12 Certificate into keychain..."
          if ! security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A; then
            echo "Standard P12 import failed (likely modern OpenSSL 3 / Windows P12 cipher). Converting to macOS legacy PKCS12 with OpenSSL 3..."
            
            PEM_PATH="$RUNNER_TEMP/temp_cert.pem"
            LEGACY_P12_PATH="$RUNNER_TEMP/legacy_certificate.p12"

            "$OPENSSL" pkcs12 -in "$CERT_PATH" -out "$PEM_PATH" -nodes -passin "pass:$P12_PASSWORD"
            "$OPENSSL" pkcs12 -export -out "$LEGACY_P12_PATH" -in "$PEM_PATH" -passout "pass:$P12_PASSWORD" -legacy

            if [ -f "$LEGACY_P12_PATH" ]; then
              echo "Legacy P12 successfully generated ($LEGACY_P12_PATH). Importing into keychain..."
              security import "$LEGACY_P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
            else
              echo "::error::Failed to generate legacy P12 file!"
              exit 1
            fi
          fi

          # 4. Update Key Partition List AFTER certificate import
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" 2>/dev/null || true

          # 5. Set keychain search list and default keychain
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # 6. Verify certificate in keychain
          echo "=== VERIFYING IMPORTED CERTIFICATES ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # 7. Decode and install Provisioning Profile
          PROVISION_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROVISION_B64_FILE="$RUNNER_TEMP/provision_b64.txt"
          
          echo "$PROVISION_BASE64" | tr -d '\r\n ' > "$PROVISION_B64_FILE"
          "$OPENSSL" base64 -d -A -in "$PROVISION_B64_FILE" -out "$PROVISION_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          UUID=$(security cms -D -i "$PROVISION_PATH" 2>/dev/null | grep -A1 "<key>UUID</key>" | grep "<string>" | sed -e 's/.*<string>//' -e 's/<\/string>.*//')

          if [ -n "$UUID" ]; then
            cp "$PROVISION_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
            echo "Successfully installed Provisioning Profile as $UUID.mobileprovision"
          else
            cp "$PROVISION_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
            echo "Installed Provisioning Profile as profile.mobileprovision (UUID not parsed)"
          fi

      # 4. Build Xcode Project & Create IPA
      - name: Build Xcode Project to IPA
        env:
          KEYCHAIN_PASSWORD: "ci_keychain_password"
        run: |
          if [ ! -d "Builds/iOS/Unity-iPhone.xcodeproj" ]; then
            echo "::error::Builds/iOS/Unity-iPhone.xcodeproj not found. Cannot proceed with Xcode build."
            exit 1
          fi

          cd Builds/iOS

          # Clean & Archive
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE="Automatic" || exit 1

          # Export IPA
          cat <<EOF > $RUNNER_TEMP/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
            -exportPath $RUNNER_TEMP/build_ipa || exit 1

      # 5. Upload IPA to TestFlight via App Store Connect API Key
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          if [ -z "$API_KEY_ID" ] || [ -z "$API_KEY_CONTENT" ]; then
            echo "::warning::App Store Connect API Key secrets missing. Skipping TestFlight upload."
            exit 0
          fi

          # Write API Key file
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

          # Find IPA file
          IPA_PATH=$(find $RUNNER_TEMP/build_ipa -name "*.ipa" | head -n 1)

          if [ -f "$IPA_PATH" ]; then
            echo "Uploading $IPA_PATH to TestFlight..."
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$API_KEY_ID" \
              --apiIssuer "$API_ISSUER_ID"
          else
            echo "::error::IPA file not found in $RUNNER_TEMP/build_ipa"
            exit 1
          fi
