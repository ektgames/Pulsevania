name: Build & Deploy to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_unity_xcode:
    name: Build Unity iOS (Export Xcode)
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Cache Unity Library directory (Disabled restore-keys to ensure clean asset import & prevent stale serialization type tree corruption)
      # - name: Cache Unity Library
      #   uses: actions/cache@v4
      #   with:
      #     path: Library
      #     key: Library-Clean-${{ github.sha }}

      # 2b. Print Unity & Project Diagnostics
      - name: Print Unity & Project Diagnostics
        run: |
          echo "=== UNITY EDITOR VERSION ==="
          cat ProjectSettings/ProjectVersion.txt || true

          echo "=== PACKAGES & VERSIONS ==="
          cat Packages/manifest.json || true

          echo "=== BUILD SCENES ==="
          grep -A10 "m_Scenes:" ProjectSettings/EditorBuildSettings.asset || true

          echo "=== PROJECT SETTINGS DIAGNOSTICS ==="
          grep -iE "applicationIdentifier|buildNumber|targetOSVersion|scriptingBackend|strippingLevel" ProjectSettings/ProjectSettings.asset || true

          echo "=== INCLUDED SCENE FILE ==="
          ls -lh Assets/Scenes/SampleScene.unity || true

      # 3. Build Unity Project to Xcode Project
      - name: Build Unity for iOS (Export Xcode)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        with:
          targetPlatform: iOS
          buildMethod: Pulsevania.EditorTools.BuildScript.BuildiOS
          buildName: Pulsevania
          buildsPath: Builds

      # 3b. Extract and Print Detailed Unity Editor.log
      - name: Extract and Print Unity Editor.log
        if: always()
        run: |
          echo "=== SEARCHING FOR SYSTEM-WIDE UNITY EDITOR.LOG ==="
          sudo chmod -R 777 . /tmp 2>/dev/null || true
          
          # Find all Editor.log or unity log files across the filesystem
          LOG_FILE=$(sudo find / -name "Editor.log" -o -name "unity*.log" 2>/dev/null | grep -v "/proc" | grep -v "/sys" | head -n 1)

          if [ -n "$LOG_FILE" ] && [ -f "$LOG_FILE" ]; then
            echo "Found Unity Editor Log at: $LOG_FILE"
            sudo cp "$LOG_FILE" $GITHUB_WORKSPACE/extracted_unity_editor.log
            sudo chmod 777 $GITHUB_WORKSPACE/extracted_unity_editor.log
            
            echo "=== CRITICAL ERRORS & EXCEPTIONS IN EDITOR.LOG ==="
            grep -iE "error|exception|failed|iOS|Xcode|BuildPipeline|BuildScript|Compilation" $GITHUB_WORKSPACE/extracted_unity_editor.log | tail -n 200 || true
            
            echo "=== LAST 300 LINES OF EDITOR.LOG ==="
            tail -n 300 $GITHUB_WORKSPACE/extracted_unity_editor.log || true
          else
            echo "No Editor.log found via find command. Checking workspace..."
            ls -la *.log 2>/dev/null || true
          fi

      # 3c. Upload Full Unity Build Log Artifact (Always)
      - name: Upload Unity Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editor-log
          path: |
            extracted_unity_editor.log
            *.log
            Library/Logs/**/*.log
          if-no-files-found: warn

      # 4. Upload exported Xcode Project Artifact
      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: Builds/iOS

  deploy_testflight:
    name: Deploy to TestFlight (macOS)
    runs-on: macos-15
    needs: build_unity_xcode
    steps:
      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1b. Select Latest Xcode & Verify SDK Version
      - name: Select Latest Xcode & Verify SDK Version
        run: |
          echo "=== AVAILABLE XCODE VERSIONS ==="
          ls -d /Applications/Xcode*.app || true

          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode path: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi

          echo "=== VERIFYING XCODEBUILD VERSION ==="
          xcodebuild -version

          echo "=== VERIFYING IOS SDK VERSION ==="
          xcrun --sdk iphoneos --show-sdk-version

      # 2. Download Exported Xcode Project Artifact
      - name: Download Xcode Project Artifact
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: Builds/iOS

      # 3. Install Apple Certificate & Provisioning Profile
      - name: Install Apple Certificate and Provisioning Profile
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          PROVISION_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$PROVISION_BASE64" ]; then
            echo "::error::Missing required signing secrets! Please verify APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASS, and APPLE_PROVISION_PROFILE_BASE64 in GitHub Secrets."
            exit 1
          fi

          # Ensure Homebrew OpenSSL 3 is available for modern PKCS12 legacy conversion
          BREW_OPENSSL_PREFIX=$(brew --prefix openssl@3 2>/dev/null || echo "/opt/homebrew/opt/openssl@3")
          if [ -f "$BREW_OPENSSL_PREFIX/bin/openssl" ]; then
            OPENSSL="$BREW_OPENSSL_PREFIX/bin/openssl"
          else
            echo "Installing openssl@3 via brew..."
            brew install openssl@3
            OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          fi

          echo "Using OpenSSL binary at: $OPENSSL"
          "$OPENSSL" version

          # Setup Keychain Path
          mkdir -p "$HOME/Library/Keychains"
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          KEYCHAIN_PASS="ci_keychain_password"

          # Clean existing temporary keychain if re-run (idempotent)
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

          # 1. Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH" 2>/dev/null || true
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # 2. Clean and decode .p12 certificate with OpenSSL 3
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          CERT_B64_FILE="$RUNNER_TEMP/cert_b64.txt"
          
          echo "$P12_BASE64" | tr -d '\r\n ' > "$CERT_B64_FILE"
          "$OPENSSL" base64 -d -A -in "$CERT_B64_FILE" -out "$CERT_PATH"

          FILE_SIZE=$(wc -c < "$CERT_PATH" | tr -d ' ')
          echo "Decoded P12 Certificate file size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "::error::Decoded P12 file is suspiciously small ($FILE_SIZE bytes). Please verify APPLE_CERTIFICATE_P12_BASE64 secret in GitHub!"
            exit 1
          fi

          # 3. Import P12 Certificate into Keychain (with Homebrew OpenSSL 3 legacy fallback)
          echo "Importing P12 Certificate into keychain..."
          if ! security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A; then
            echo "Standard P12 import failed (likely modern OpenSSL 3 / Windows P12 cipher). Converting to macOS legacy PKCS12 with OpenSSL 3..."
            
            PEM_PATH="$RUNNER_TEMP/temp_cert.pem"
            LEGACY_P12_PATH="$RUNNER_TEMP/legacy_certificate.p12"

            "$OPENSSL" pkcs12 -in "$CERT_PATH" -out "$PEM_PATH" -nodes -passin "pass:$P12_PASSWORD"
            "$OPENSSL" pkcs12 -export -out "$LEGACY_P12_PATH" -in "$PEM_PATH" -passout "pass:$P12_PASSWORD" -legacy

            if [ -f "$LEGACY_P12_PATH" ]; then
              echo "Legacy P12 successfully generated ($LEGACY_P12_PATH). Importing into keychain..."
              security import "$LEGACY_P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
            else
              echo "::error::Failed to generate legacy P12 file!"
              exit 1
            fi
          fi

          # 4. Update Key Partition List AFTER certificate import
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" 2>/dev/null || true

          # 5. Set keychain search list and default keychain
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # 6. Verify certificate in keychain
          echo "=== VERIFYING IMPORTED CODESIGNING IDENTITIES ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # 7. Decode and install Provisioning Profile
          PROVISION_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROVISION_B64_FILE="$RUNNER_TEMP/provision_b64.txt"
          
          echo "$PROVISION_BASE64" | tr -d '\r\n ' > "$PROVISION_B64_FILE"
          "$OPENSSL" base64 -d -A -in "$PROVISION_B64_FILE" -out "$PROVISION_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "=== PROVISIONING PROFILE VERIFICATION VIA SECURITY CMS ==="
          security cms -D -i "$PROVISION_PATH" > "$RUNNER_TEMP/profile_plist.xml" 2>/dev/null || true

          PROVISION_UUID=$(grep -A1 "<key>UUID</key>" "$RUNNER_TEMP/profile_plist.xml" | grep "<string>" | head -n 1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
          PROVISION_NAME=$(grep -A1 "<key>Name</key>" "$RUNNER_TEMP/profile_plist.xml" | grep "<string>" | head -n 1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
          PROVISION_TEAM_ID=$(grep -A1 "<key>TeamIdentifier</key>" "$RUNNER_TEMP/profile_plist.xml" | grep "<array>" -A1 | grep "<string>" | head -n 1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
          PROVISION_APP_ID=$(grep -A1 "<key>application-identifier</key>" "$RUNNER_TEMP/profile_plist.xml" | grep "<string>" | head -n 1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')

          echo "Profile Name: $PROVISION_NAME"
          echo "Profile UUID: $PROVISION_UUID"
          echo "Team Identifier: $PROVISION_TEAM_ID"
          echo "App Identifier: $PROVISION_APP_ID"

          if [ -n "$PROVISION_UUID" ]; then
            cp "$PROVISION_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROVISION_UUID.mobileprovision"
            echo "Successfully installed Provisioning Profile as $PROVISION_UUID.mobileprovision"
          fi
          
          # Always install as profile.mobileprovision too
          cp "$PROVISION_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

          # Export variables to GITHUB_ENV
          echo "PROVISION_UUID=$PROVISION_UUID" >> $GITHUB_ENV
          echo "PROVISION_NAME=$PROVISION_NAME" >> $GITHUB_ENV

      # 4. Build Xcode Project & Create IPA
      - name: Build Xcode Project to IPA
        env:
          KEYCHAIN_PASSWORD: "ci_keychain_password"
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ ! -d "Builds/iOS/Unity-iPhone.xcodeproj" ]; then
            echo "::error::Builds/iOS/Unity-iPhone.xcodeproj not found. Cannot proceed with Xcode build."
            exit 1
          fi

          cd Builds/iOS

          BUILD_NUM="${BUILD_NUMBER:-65}"
          echo "=== DYNAMIC BUILD NUMBER FOR XCODE ARCHIVE: $BUILD_NUM ==="

          if [ -f "Info.plist" ]; then
            plutil -replace CFBundleVersion -string "$BUILD_NUM" Info.plist 2>/dev/null || true
          fi
          echo "=== VERIFYING CFBundleVersion IN INFO.PLIST ==="
          plutil -p Info.plist | grep -i CFBundleVersion || true

          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"

          echo "Configuring target-specific signing in Unity-iPhone.xcodeproj/project.pbxproj..."
          echo "Team ID: $TEAM_ID"
          echo "Provisioning Profile Name: $PROVISION_NAME"
          echo "Provisioning Profile UUID: $PROVISION_UUID"

          # Target-specific signing patch for application target 1D6058900D05DD3D006BFB54 / 1D6058960D05DD3E006BFB54
          python3 - << 'PYEOF'
          import os, re, sys

          pbx_path = "Unity-iPhone.xcodeproj/project.pbxproj"
          provision_uuid = os.environ.get("PROVISION_UUID", "")
          provision_name = os.environ.get("PROVISION_NAME", "")
          provision_specifier = provision_name if provision_name else provision_uuid
          team_id = os.environ.get("TEAM_ID", "")

          if not os.path.exists(pbx_path):
              print(f"Error: {pbx_path} not found")
              sys.exit(1)

          with open(pbx_path, "r") as f:
              content = f.read()

          # 1. Parse PBXNativeTarget section
          native_match = re.search(r'/\* Begin PBXNativeTarget section \*/([\s\S]*?)/\*\s*End PBXNativeTarget section \*/', content)
          if not native_match:
              print("Error: PBXNativeTarget section not found!")
              sys.exit(1)

          native_section = native_match.group(1)

          iphone_target_guid = None
          iphone_config_list_guid = None
          framework_target_guid = None
          framework_config_list_guid = None

          # Find target blocks: <GUID> /* <Name> */ = { ... productType = "com.apple.product-type.application"; ... buildConfigurationList = <GUID> ... };
          target_blocks = re.findall(r'([A-Z0-9]+)\s*(?:/\*.*?\*/)?\s*=\s*\{([\s\S]*?)\};', native_section)
          for guid, body in target_blocks:
              if "isa = PBXNativeTarget" in body:
                  name_m = re.search(r'name = "?([^";\s]+)"?', body)
                  list_m = re.search(r'buildConfigurationList = ([A-Z0-9]+)', body)

                  t_name = name_m.group(1) if name_m else ""
                  t_list = list_m.group(1) if list_m else ""

                  # Match ONLY the application target (Unity-iPhone), NOT Tests!
                  if (t_name == "Unity-iPhone" or 'name = "Unity-iPhone"' in body or 'name = Unity-iPhone;' in body) and "Tests" not in body and "Tests" not in guid:
                      iphone_target_guid = guid
                      iphone_config_list_guid = t_list
                  elif t_name == "UnityFramework" or "UnityFramework" in body:
                      framework_target_guid = guid
                      framework_config_list_guid = t_list

          # Explicit fallback for standard Unity application target GUID 1D6058900D05DD3D006BFB54 / 1D6058960D05DD3E006BFB54
          if not iphone_config_list_guid:
              m = re.search(r'buildConfigurationList = ([A-Z0-9]+)\s*/\*\s*Build configuration list for PBXNativeTarget "Unity-iPhone"\s*\*/', native_section)
              if m:
                  iphone_config_list_guid = m.group(1)
                  iphone_target_guid = "1D6058900D05DD3D006BFB54"

          # 2. Parse XCConfigurationList section to resolve buildConfigurations arrays
          config_list_match = re.search(r'/\* Begin XCConfigurationList section \*/([\s\S]*?)/\*\s*End XCConfigurationList section \*/', content)
          if not config_list_match:
              print("Error: XCConfigurationList section not found!")
              sys.exit(1)

          config_list_section = config_list_match.group(1)

          iphone_config_guids = []
          framework_config_guids = []

          config_list_blocks = re.findall(r'([A-Z0-9]+)\s*(?:/\*.*?\*/)?\s*=\s*\{([\s\S]*?)\};', config_list_section)
          for list_guid, list_body in config_list_blocks:
              if "isa = XCConfigurationList" in list_body:
                  configs_arr_m = re.search(r'buildConfigurations = \(([\s\S]*?)\);', list_body)
                  if configs_arr_m:
                      guids = re.findall(r'([A-Z0-9]+)\s*/\*', configs_arr_m.group(1))
                      if list_guid == iphone_config_list_guid:
                          iphone_config_guids = guids
                      elif list_guid == framework_config_list_guid:
                          framework_config_guids = guids

          # Print exact required VERIFICATION format
          print("=== VERIFICATION ===")
          print(f"Unity-iPhone Target GUID: {iphone_target_guid}")
          print(f"Unity-iPhone Config List GUID: {iphone_config_list_guid}")
          print(f"Unity-iPhone Config GUIDs: {iphone_config_guids}")
          print(f"UnityFramework Target GUID: {framework_target_guid}")
          print(f"UnityFramework Config List GUID: {framework_config_list_guid}")
          print(f"UnityFramework Config GUIDs: {framework_config_guids}")

          if not iphone_config_guids:
              print("Error: Failed to resolve Unity-iPhone application target XCBuildConfiguration GUIDs!")
              sys.exit(1)

          # 3. Modify XCBuildConfiguration section line by line
          lines = content.splitlines(True)
          new_lines = []
          current_block_guid = None
          in_build_settings = False
          in_xc_section = False

          for line in lines:
              if "/* Begin XCBuildConfiguration section */" in line:
                  in_xc_section = True
              elif "/* End XCBuildConfiguration section */" in line:
                  in_xc_section = False
                  current_block_guid = None

              if in_xc_section:
                  m_block = re.match(r'\s*([A-Z0-9]+)\s*/\*\s*(\w+)\s*\*/\s*=\s*\{', line)
                  if m_block:
                      current_block_guid = m_block.group(1)

                  if current_block_guid in framework_config_guids:
                      if "PROVISIONING_PROFILE" in line or "PROVISIONING_PROFILE_SPECIFIER" in line:
                          continue

                  if current_block_guid in iphone_config_guids:
                      if "CODE_SIGN_STYLE" in line or "PROVISIONING_PROFILE" in line or "CODE_SIGN_IDENTITY" in line or "DEVELOPMENT_TEAM" in line:
                          continue

              if ("process_symbols" in line or "Unity Process symbols" in line) and "shellScript" in line:
                  line = '\t\tshellScript = "echo \\"Unity symbol processing disabled in CI\\"; exit 0;";\n'

              # Remove buildPhases array entry for Unity Process symbols
              if "Unity Process symbols" in line and "=" not in line:
                  print(f"[Patch] Removing buildPhases reference: {line.strip()}")
                  continue

              new_lines.append(line)

              if in_xc_section and current_block_guid in iphone_config_guids and line.strip() == "buildSettings = {":
                  in_build_settings = True
                  new_lines.append('\t\t\t\tCODE_SIGN_STYLE = Manual;\n')
                  new_lines.append(f'\t\t\t\tDEVELOPMENT_TEAM = "{team_id}";\n')
                  new_lines.append('\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n')
                  new_lines.append('\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n')
                  new_lines.append(f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{provision_specifier}";\n')
                  new_lines.append(f'\t\t\t\t"PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]" = "{provision_specifier}";\n')
                  new_lines.append(f'\t\t\t\tPROVISIONING_PROFILE = "{provision_uuid}";\n')
                  new_lines.append(f'\t\t\t\t"PROVISIONING_PROFILE[sdk=iphoneos*]" = "{provision_uuid}";\n')
                  build_num = os.environ.get("BUILD_NUMBER", "65")
                  new_lines.append(f'\t\t\t\tCURRENT_PROJECT_VERSION = {build_num};\n')

          with open(pbx_path, "w") as f:
              f.writelines(new_lines)

          print("\n=== UNITY-IPHONE SIGNING ===")
          print(f"CODE_SIGN_STYLE = Manual")
          print(f"DEVELOPMENT_TEAM = {team_id}")
          print(f"CODE_SIGN_IDENTITY = Apple Distribution")
          print(f"PROVISIONING_PROFILE_SPECIFIER = {provision_specifier}")
          print(f"PROVISIONING_PROFILE = {provision_uuid}")

          print("\n=== UNITYFRAMEWORK SIGNING ===")
          print("Verified NO PROVISIONING_PROFILE in UnityFramework configurations.")
          PYEOF

          echo "=== VERIFYING PROCESS_SYMBOLS & USYMTOOL FILES EXIST ==="
          ls -la process_symbols.sh usymtoolarm64 || true

          echo "=== VERIFYING SYMBOL PROCESSING BUILD PHASES IN PBXPROJ ==="
          grep -n -C 3 "Unity Process symbols" Unity-iPhone.xcodeproj/project.pbxproj || true
          grep -n -C 3 "process_symbols" Unity-iPhone.xcodeproj/project.pbxproj || true

          echo "=== VERIFYING XCODE PROJECT PARSE & LIST ==="
          plutil -lint Unity-iPhone.xcodeproj/project.pbxproj || exit 1
          xcodebuild -project Unity-iPhone.xcodeproj -list || exit 1

          echo "=== XCODEBUILD SHOWBUILDSETTINGS FOR UNITY-IPHONE RELEASE ==="
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -target Unity-iPhone \
            -configuration Release \
            -showBuildSettings | grep -iE "TARGET_NAME|PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED|EXPANDED_CODE_SIGN_IDENTITY|EXPANDED_PROVISIONING_PROFILE" || true

          # Clean & Archive with Manual Signing (Apple Distribution)
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" || exit 1

          echo "=== SEARCHING FOR dSYM FILES ==="
          find "$RUNNER_TEMP/Unity-iPhone.xcarchive" -type d -name "*.dSYM" -print || true
          find "$GITHUB_WORKSPACE" -type d -name "*.dSYM" -print || true

          echo "=== COLLECTING dSYM FILES ==="
          mkdir -p "$RUNNER_TEMP/dSYMs"
          find "$RUNNER_TEMP/Unity-iPhone.xcarchive" -type d -name "*.dSYM" -exec cp -R {} "$RUNNER_TEMP/dSYMs/" \;

          if ! find "$RUNNER_TEMP/dSYMs" -type d -name "*.dSYM" | grep -q .; then
              echo "::error::NO dSYM FILES WERE FOUND IN THE XCODE ARCHIVE!"
              exit 1
          fi

          echo "=== dSYM FILES IN $RUNNER_TEMP/dSYMs ==="
          find "$RUNNER_TEMP/dSYMs" -maxdepth 2 -type d -name "*.dSYM" -print

          echo "=== DWARF FILES ==="
          find "$RUNNER_TEMP/dSYMs" -type f -path "*/Contents/Resources/DWARF/*" -print

          echo "=== DWARFDUMP UUID VERIFICATION ==="
          for dsym in "$RUNNER_TEMP"/dSYMs/*.dSYM; do
              if [ -d "$dsym" ]; then
                  echo "===== $dsym ====="
                  dwarfdump --uuid "$dsym" || true
              fi
          done

          # Export IPA with Manual Signing ExportOptions.plist generated via Python plistlib
          python3 - << 'PYEOF'
          import os, plistlib

          team_id = os.environ.get("TEAM_ID", "")
          provision_name = os.environ.get("PROVISION_NAME", "")
          provision_uuid = os.environ.get("PROVISION_UUID", "")
          provision_specifier = provision_name if provision_name else provision_uuid

          export_options = {
              "method": "app-store",
              "signingStyle": "manual",
              "teamID": team_id,
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {
                  "com.ektgames.pulsevania": provision_specifier
              },
              "uploadSymbols": True,
              "compileBitcode": False
          }

          runner_temp = os.environ.get("RUNNER_TEMP", "/tmp")
          plist_path = os.path.join(runner_temp, "exportOptions.plist")

          with open(plist_path, "wb") as f:
              plistlib.dump(export_options, f, fmt=plistlib.FMT_XML)

          print(f"Successfully generated valid XML ExportOptions.plist at {plist_path}")
          PYEOF

          echo "=== VERIFYING EXPORT OPTIONS PLIST ==="
          plutil -lint $RUNNER_TEMP/exportOptions.plist || exit 1
          plutil -p $RUNNER_TEMP/exportOptions.plist

          echo "Exporting IPA with ExportOptions.plist..."
          mkdir -p $RUNNER_TEMP/build_ipa

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
            -exportPath $RUNNER_TEMP/build_ipa || exit 1

          echo "=== VERIFYING GENERATED IPA FILE ==="
          ls -la $RUNNER_TEMP/build_ipa/*.ipa || exit 1

      # 4b. Upload iOS dSYM Artifacts for Crash Symbolication
      - name: Upload iOS dSYM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-dsyms
          path: ${{ runner.temp }}/dSYMs
          if-no-files-found: error

      # 5. Upload IPA to TestFlight via App Store Connect API Key
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPLE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPLE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER }}
          API_KEY_CONTENT: ${{ secrets.APPLE_CONNECT_KEY_CONTENT || secrets.APP_STORE_CONNECT_API_KEY_CONTENT || secrets.APP_STORE_CONNECT_KEY_CONTENT || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$API_KEY_ID" ] || [ -z "$API_KEY_CONTENT" ] || [ -z "$API_ISSUER_ID" ]; then
            echo "::error::App Store Connect API Key secrets missing! Please verify APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, and APPLE_CONNECT_KEY_CONTENT in GitHub Secrets."
            exit 1
          fi

          echo "App Store Connect Key ID: $API_KEY_ID"
          echo "App Store Connect Issuer ID: $API_ISSUER_ID"

          # Write API Key file (supporting raw P8 or base64)
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

          if echo "$API_KEY_CONTENT" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$API_KEY_CONTENT" > "$KEY_FILE"
          else
            echo "$API_KEY_CONTENT" | base64 -d > "$KEY_FILE" 2>/dev/null || echo "$API_KEY_CONTENT" > "$KEY_FILE"
          fi

          chmod 600 "$KEY_FILE"
          echo "AuthKey P8 file generated at $KEY_FILE"

          # Find IPA file
          IPA_PATH=$(find $RUNNER_TEMP/build_ipa -name "*.ipa" | head -n 1)

          if [ -f "$IPA_PATH" ]; then
            echo "Uploading $IPA_PATH to TestFlight..."
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$API_KEY_ID" \
              --apiIssuer "$API_ISSUER_ID"
          else
            echo "::error::IPA file not found in $RUNNER_TEMP/build_ipa"
            exit 1
          fi

      # 6. Wait for App Store Connect Processing & Auto-Assign to Beta Group
      - name: Auto-Assign Build to TestFlight Beta Group
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPLE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPLE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ]; then
            echo "::error::App Store Connect API Key secrets missing for Beta Group Assignment!"
            exit 1
          fi

          echo "Installing Python dependencies (pyjwt, cryptography, requests)..."
          python3 -m pip install pyjwt cryptography requests >/dev/null 2>&1 || pip3 install pyjwt cryptography requests

          python3 - << 'PYEOF'
          import os, sys, time, json
          import jwt
          import requests

          api_key_id = os.environ.get("API_KEY_ID")
          api_issuer_id = os.environ.get("API_ISSUER_ID")
          build_number = os.environ.get("BUILD_NUMBER")
          bundle_id = "com.ektgames.pulsevania"

          if not api_key_id or not api_issuer_id or not build_number:
              print("::error::Missing required API credentials or BUILD_NUMBER!")
              sys.exit(1)

          key_file = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{api_key_id}.p8")
          if not os.path.exists(key_file):
              print(f"::error::Private key file {key_file} not found!")
              sys.exit(1)

          with open(key_file, "r") as f:
              private_key = f.read()

          def generate_token():
              now = int(time.time())
              payload = {
                  "iss": api_issuer_id,
                  "exp": now + 1200,
                  "aud": "appstoreconnect-v1"
              }
              headers = {
                  "alg": "ES256",
                  "kid": api_key_id,
                  "typ": "JWT"
              }
              return jwt.encode(payload, private_key, algorithm="ES256", headers=headers)

          # 1. Fetch App ID
          print(f"=== FETCHING APP RESOURCE FOR BUNDLE ID: {bundle_id} ===")
          tok = generate_token()
          app_res = requests.get(
              f"https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]={bundle_id}",
              headers={"Authorization": f"Bearer {tok}"}
          )

          if app_res.status_code != 200:
              print(f"::error::Failed to query app resource: HTTP {app_res.status_code} - {app_res.text}")
              sys.exit(1)

          apps = app_res.json().get("data", [])
          if not apps:
              print(f"::error::App with bundleId '{bundle_id}' not found in App Store Connect!")
              sys.exit(1)

          app_id = apps[0]["id"]
          print(f"Located App Resource ID: {app_id}")

          # 2. Fetch Beta Groups for App
          print(f"=== FETCHING BETA GROUPS FOR APP ID: {app_id} ===")
          tok = generate_token()
          bg_res = requests.get(
              f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/betaGroups",
              headers={"Authorization": f"Bearer {tok}"}
          )

          if bg_res.status_code != 200:
              print(f"::error::Failed to query beta groups: HTTP {bg_res.status_code} - {bg_res.text}")
              sys.exit(1)

          beta_groups = bg_res.json().get("data", [])
          if not beta_groups:
              print(f"::error::No beta groups found for app '{bundle_id}'!")
              sys.exit(1)

          target_group = None
          for bg in beta_groups:
              name = bg.get("attributes", {}).get("name", "")
              is_internal = bg.get("attributes", {}).get("isInternalGroup", False)
              has_access_all = bg.get("attributes", {}).get("hasAccessToAllBuilds", False)
              print(f"Beta Group Found: '{name}' (ID: {bg['id']}, Internal: {is_internal}, hasAccessToAllBuilds: {has_access_all})")
              
              if is_internal or "TestEKT" in name or target_group is None:
                  target_group = bg

          if not target_group:
              print("::error::Target beta group could not be resolved!")
              sys.exit(1)

          group_id = target_group["id"]
          group_name = target_group["attributes"]["name"]
          has_access_all = target_group["attributes"].get("hasAccessToAllBuilds", False)

          if not has_access_all:
              print(f"[Notice] Beta group '{group_name}' hasAccessToAllBuilds is False. Explicit build-to-betaGroup relationship assignment via API is required.")

          # 3. Poll App Store Connect for Processed Build
          print(f"=== POLLING APP STORE CONNECT FOR PROCESSED BUILD NUMBER '{build_number}' ===")
          max_attempts = 40  # 40 * 30s = 20 minutes max
          build_resource = None

          for attempt in range(1, max_attempts + 1):
              tok = generate_token()
              build_url = f"https://api.appstoreconnect.apple.com/v1/builds?filter[app]={app_id}&filter[version]={build_number}"
              b_res = requests.get(build_url, headers={"Authorization": f"Bearer {tok}"})
              
              if b_res.status_code == 200:
                  builds = b_res.json().get("data", [])
                  for b in builds:
                      ver = b.get("attributes", {}).get("version")
                      state = b.get("attributes", {}).get("processingState")
                      if ver == str(build_number):
                          print(f"[Attempt {attempt}/{max_attempts}] Found Build version '{ver}' - processingState: '{state}'")
                          if state == "VALID":
                              build_resource = b
                              break
                          elif state in ["FAILED", "INVALID"]:
                              print(f"::error::Build processing failed on App Store Connect with state: '{state}'")
                              sys.exit(1)
                  if build_resource:
                      break
              else:
                  print(f"[Attempt {attempt}/{max_attempts}] API query returned HTTP {b_res.status_code}")
              
              time.sleep(30)

          if not build_resource:
              print(f"::error::Timed out waiting for Build '{build_number}' to transition to VALID processingState on App Store Connect!")
              sys.exit(1)

          build_id = build_resource["id"]
          print(f"Located Processed Build Resource ID: {build_id}")

          # 4. Assign Build to Beta Group via POST
          print(f"=== POST /v1/builds/{build_id}/relationships/betaGroups ===")
          tok = generate_token()
          assign_url = f"https://api.appstoreconnect.apple.com/v1/builds/{build_id}/relationships/betaGroups"
          payload = {
              "data": [
                  {
                      "type": "betaGroups",
                      "id": group_id
                  }
              ]
          }
          assign_res = requests.post(
              assign_url,
              headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json"},
              json=payload
          )

          if assign_res.status_code not in [200, 204]:
              print(f"::error::Failed to link build to beta group! HTTP {assign_res.status_code}: {assign_res.text}")
              sys.exit(1)

          print(f"Relationship POST request succeeded with HTTP status: {assign_res.status_code}")

          # 5. Verify Relationship via GET
          print(f"=== GET /v1/builds/{build_id}/relationships/betaGroups ===")
          tok = generate_token()
          verify_url = f"https://api.appstoreconnect.apple.com/v1/builds/{build_id}/relationships/betaGroups"
          verify_res = requests.get(verify_url, headers={"Authorization": f"Bearer {tok}"})

          if verify_res.status_code != 200:
              print(f"::error::Relationship verification GET failed with HTTP {verify_res.status_code}: {verify_res.text}")
              sys.exit(1)

          linked_ids = [g["id"] for g in verify_res.json().get("data", [])]
          if group_id not in linked_ids:
              print(f"::error::Verification failed! Beta Group ID '{group_id}' was not returned in linked groups: {linked_ids}")
              sys.exit(1)

          # 6. Final Required Verification Block
          print("\n" + "=" * 60)
          print("TESTFLIGHT GROUP ASSIGNMENT SUCCESS")
          print(f"Build: {build_number}")
          print(f"Build ID: {build_id}")
          print(f"Beta Group: {group_name}")
          print(f"Beta Group ID: {group_id}")
          print("=" * 60 + "\n")
          PYEOF
