name: Build & Deploy to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_ios:
    name: Build Unity iOS & Upload to TestFlight
    runs-on: macos-14
    steps:
      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Cache Unity Library directory for faster builds
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # 3. Build Unity Project to Xcode Project
      - name: Build Unity for iOS (Export Xcode)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: iOS
          buildMethod: Pulsevania.EditorTools.BuildScript.BuildiOS
          buildName: Pulsevania
          outputPath: Builds/iOS

      # 4. Install Apple Certificate & Provisioning Profile
      - name: Install Apple Certificate and Provisioning Profile
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          PROVISION_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "ci_keychain_password"
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PROVISION_BASE64" ]; then
            echo "::warning::Apple Certificate or Provisioning Profile secrets missing. Skipping signing and TestFlight upload step."
            exit 0
          fi

          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          CERTIFICATE_P12_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$P12_BASE64" | base64 --decode -o $CERTIFICATE_P12_PATH
          security import $CERTIFICATE_P12_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH $(security list-keychains | tr -d '"')

          # Import Provisioning Profile
          PROVISION_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISION_BASE64" | base64 --decode -o $PROVISION_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROVISION_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # 5. Build Xcode Project & Create IPA
      - name: Build Xcode Project to IPA
        env:
          KEYCHAIN_PASSWORD: "ci_keychain_password"
        run: |
          if [ ! -d "Builds/iOS/Unity-iPhone.xcodeproj" ]; then
            echo "::warning::Builds/iOS/Unity-iPhone.xcodeproj not found. Skipping Xcode build."
            exit 0
          fi

          cd Builds/iOS

          # Clean & Archive
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE="Automatic" || exit 1

          # Export IPA
          cat <<EOF > $RUNNER_TEMP/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
            -exportPath $RUNNER_TEMP/build_ipa || exit 1

      # 6. Upload IPA to TestFlight via App Store Connect API Key
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          if [ -z "$API_KEY_ID" ] || [ -z "$API_KEY_CONTENT" ]; then
            echo "::warning::App Store Connect API Key secrets missing. Skipping TestFlight upload."
            exit 0
          fi

          # Write API Key file
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

          # Find IPA file
          IPA_PATH=$(find $RUNNER_TEMP/build_ipa -name "*.ipa" | head -n 1)

          if [ -f "$IPA_PATH" ]; then
            echo "Uploading $IPA_PATH to TestFlight..."
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$API_KEY_ID" \
              --apiIssuer "$API_ISSUER_ID"
          else
            echo "::error::IPA file not found in $RUNNER_TEMP/build_ipa"
          fi
