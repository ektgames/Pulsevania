name: Build & Deploy to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_unity_xcode:
    name: Build Unity iOS (Export Xcode)
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Cache Unity Library directory for faster builds
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # 3. Build Unity Project to Xcode Project
      - name: Build Unity for iOS (Export Xcode)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          buildMethod: Pulsevania.EditorTools.BuildScript.BuildiOS
          buildName: Pulsevania
          buildsPath: Builds

      # 3b. Extract and Print Detailed Unity Editor.log
      - name: Extract and Print Unity Editor.log
        if: always()
        run: |
          echo "=== SEARCHING FOR SYSTEM-WIDE UNITY EDITOR.LOG ==="
          sudo chmod -R 777 . /tmp 2>/dev/null || true
          
          # Find all Editor.log or unity log files across the filesystem
          LOG_FILE=$(sudo find / -name "Editor.log" -o -name "unity*.log" 2>/dev/null | grep -v "/proc" | grep -v "/sys" | head -n 1)

          if [ -n "$LOG_FILE" ] && [ -f "$LOG_FILE" ]; then
            echo "Found Unity Editor Log at: $LOG_FILE"
            sudo cp "$LOG_FILE" $GITHUB_WORKSPACE/extracted_unity_editor.log
            sudo chmod 777 $GITHUB_WORKSPACE/extracted_unity_editor.log
            
            echo "=== CRITICAL ERRORS & EXCEPTIONS IN EDITOR.LOG ==="
            grep -iE "error|exception|failed|iOS|Xcode|BuildPipeline|BuildScript|Compilation" $GITHUB_WORKSPACE/extracted_unity_editor.log | tail -n 200 || true
            
            echo "=== LAST 300 LINES OF EDITOR.LOG ==="
            tail -n 300 $GITHUB_WORKSPACE/extracted_unity_editor.log || true
          else
            echo "No Editor.log found via find command. Checking workspace..."
            ls -la *.log 2>/dev/null || true
          fi

      # 3c. Upload Full Unity Build Log Artifact (Always)
      - name: Upload Unity Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editor-log
          path: |
            extracted_unity_editor.log
            *.log
            Library/Logs/**/*.log
          if-no-files-found: warn

      # 4. Upload exported Xcode Project Artifact
      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: Builds/iOS

  deploy_testflight:
    name: Deploy to TestFlight (macOS)
    runs-on: macos-14
    needs: build_unity_xcode
    steps:
      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Download Exported Xcode Project Artifact
      - name: Download Xcode Project Artifact
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: Builds/iOS

      # 3. Install Apple Certificate & Provisioning Profile
      - name: Install Apple Certificate and Provisioning Profile
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          PROVISION_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "ci_keychain_password"
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PROVISION_BASE64" ]; then
            echo "::warning::Apple Certificate or Provisioning Profile secrets missing. Skipping signing and TestFlight upload step."
            exit 0
          fi

          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH $(security list-keychains | tr -d '"')

          # Import Provisioning Profile
          PROVISION_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISION_BASE64" | base64 --decode -o $PROVISION_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROVISION_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # 4. Build Xcode Project & Create IPA
      - name: Build Xcode Project to IPA
        env:
          KEYCHAIN_PASSWORD: "ci_keychain_password"
        run: |
          if [ ! -d "Builds/iOS/Unity-iPhone.xcodeproj" ]; then
            echo "::warning::Builds/iOS/Unity-iPhone.xcodeproj not found. Skipping Xcode build."
            exit 0
          fi

          cd Builds/iOS

          # Clean & Archive
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE="Automatic" || exit 1

          # Export IPA
          cat <<EOF > $RUNNER_TEMP/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
            -exportPath $RUNNER_TEMP/build_ipa || exit 1

      # 5. Upload IPA to TestFlight via App Store Connect API Key
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          if [ -z "$API_KEY_ID" ] || [ -z "$API_KEY_CONTENT" ]; then
            echo "::warning::App Store Connect API Key secrets missing. Skipping TestFlight upload."
            exit 0
          fi

          # Write API Key file
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

          # Find IPA file
          IPA_PATH=$(find $RUNNER_TEMP/build_ipa -name "*.ipa" | head -n 1)

          if [ -f "$IPA_PATH" ]; then
            echo "Uploading $IPA_PATH to TestFlight..."
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$API_KEY_ID" \
              --apiIssuer "$API_ISSUER_ID"
          else
            echo "::error::IPA file not found in $RUNNER_TEMP/build_ipa"
          fi
