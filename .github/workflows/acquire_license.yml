name: Acquire Unity License (.alf)

on:
  workflow_dispatch:

jobs:
  request_alf:
    name: Request Unity Activation File (.alf)
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Run Unity to generate .alf file using game-ci/unity-builder
      - name: Request manual activation file (.alf)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          customParameters: -createManualActivationFile

      # 3. Locate and stage the generated .alf file
      - name: Find and stage .alf file
        run: |
          mkdir -p alf_output
          find . -maxdepth 3 -name "*.alf" -exec cp {} alf_output/ \; 2>/dev/null || true
          find /tmp -name "*.alf" -exec cp {} alf_output/ 2>/dev/null || true
          ls -la alf_output/

      # 4. Upload activation file artifact
      - name: Upload activation file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.4.9f1.alf
          path: alf_output/*.alf
