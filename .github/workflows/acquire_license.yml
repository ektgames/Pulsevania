name: Acquire Unity License (.alf)

on:
  workflow_dispatch:

jobs:
  request_alf:
    name: Request Unity Activation File (.alf)
    runs-on: ubuntu-latest
    steps:
      # 1. Request manual activation file (.alf) for Unity version 6000.4.9f1
      - name: Request manual activation file (.alf)
        uses: game-ci/unity-request-activation-file@v2
        id: get_alf
        with:
          unityVersion: 6000.4.9f1

      # 2. Upload .alf file as downloadable artifact
      - name: Upload activation file artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.4.9f1.alf
          path: ${{ steps.get_alf.outputs.filePath }}
